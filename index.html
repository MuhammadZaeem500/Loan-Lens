<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Lens - Prediction Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-lg bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-sky-400">Loan Approval Predictor</h1>
        
        <form id="loan-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Number of Dependents</label>
                <input type="number" id="dependents" value="0" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Education</label>
                <select id="education" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
                    <option value="Graduate">Graduate</option>
                    <option value="Not Graduate">Not Graduate</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">CIBIL Score</label>
                <input type="number" id="cibil_score" value="700" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Loan Amount</label>
                <input type="number" id="loan_amount" value="500000" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-sky-500">
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 font-semibold py-2 px-4 rounded transition duration-200">
                Check Approval
            </button>
        </form>

        <div id="result-box" class="mt-6 hidden p-4 bg-slate-900 rounded border border-slate-700 text-center">
            <p id="result-text" class="font-medium"></p>
        </div>
    </div>

    <script>
        document.getElementById('loan-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevents page reload so network tab logs persist

            const payload = {
                no_of_dependents: parseInt(document.getElementById('dependents').value),
                education: document.getElementById('education').value,
                cibil_score: parseInt(document.getElementById('cibil_score').value),
                loan_amount: parseFloat(document.getElementById('loan_amount').value)
            };

            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');

            try {
                // Updated to point to your live Render backend API route
                const response = await fetch('https://loan-lens-0jbw.onrender.com/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                resultBox.classList.remove('hidden');
                resultText.textContent = `Prediction Result: ${data.prediction}`;
                resultText.className = "text-green-400 font-semibold";

            } catch (error) {
                console.error('Fetch error:', error);
                resultBox.classList.remove('hidden');
                resultText.textContent = 'Error connecting to Render backend server.';
                resultText.className = "text-red-400 font-semibold";
            }
        });
    </script>
</body>
</html>
